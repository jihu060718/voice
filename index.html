<!-- 고해상도 화면 보정: pdf.js 렌더링에 devicePixelRatio 자동 적용 -->
<script>
(function () {
  var dpr = Math.min(window.devicePixelRatio || 1, 3);
  if (dpr <= 1) return;
  function patchPage(page) {
    if (page.__dfDprPatched) return page;
    page.__dfDprPatched = true;
    var origRender = page.render.bind(page);
    page.render = function (ctx) {
      try {
        // 앱이 transform을 직접 지정했다면(자체 DPR 처리) 건드리지 않음
        if (ctx && ctx.canvasContext && ctx.viewport && !ctx.transform) {
          var canvas = ctx.canvasContext.canvas;
          var w = ctx.viewport.width, h = ctx.viewport.height;
          canvas.width = Math.floor(w * dpr);
          canvas.height = Math.floor(h * dpr);
          canvas.style.width = Math.floor(w) + 'px';
          canvas.style.height = Math.floor(h) + 'px';
          ctx.transform = [dpr, 0, 0, dpr, 0, 0];
        }
      } catch (err) {}
      return origRender(ctx);
    };
    return page;
  }
  function patchDoc(doc) {
    if (doc.__dfDprPatched) return doc;
    doc.__dfDprPatched = true;
    var origGetPage = doc.getPage.bind(doc);
    doc.getPage = function (n) { return origGetPage(n).then(patchPage); };
    return doc;
  }
  function patchLib(lib) {
    if (!lib || lib.__dfDprPatched || typeof lib.getDocument !== 'function') return;
    lib.__dfDprPatched = true;
    var origGetDocument = lib.getDocument;
    lib.getDocument = function () {
      var task = origGetDocument.apply(lib, arguments);
      var patched = task.promise.then(patchDoc);
      try {
        Object.defineProperty(task, 'promise', { get: function () { return patched; } });
      } catch (err) {}
      return task;
    };
  }
  // pdf.js가 나중에 로드되는 경우까지 대기 (최대 10초, 없으면 아무 동작 안 함)
  if (window.pdfjsLib) { patchLib(window.pdfjsLib); }
  else {
    var n = 0, t = setInterval(function () {
      if (window.pdfjsLib) { patchLib(window.pdfjsLib); clearInterval(t); }
      else if (++n > 100) { clearInterval(t); }
    }, 100);
  }
})();
</script>

</head>


<body>

<div class="container">

    <h1>🎤 한국어 → 영어 AI 음성 번역</h1>

    <div id="status">
        음성 인식 준비 완료
    </div>

    <div id="modelStatus">
        AI 모델은 번역할 때 자동으로 불러옵니다.
    </div>


    <!-- 음성 인식 버튼 -->

    <button id="startBtn">
        🎤 음성 인식 시작
    </button>


    <!-- 한국어 -->

    <h2>한국어</h2>

    <textarea
        id="koreanText"
        placeholder="한국어로 말하거나 직접 입력하세요."
    ></textarea>


    <!-- 직접 번역 버튼 -->

    <button id="translateBtn">
        🤖 AI 영어 번역
    </button>


    <!-- 영어 -->

    <h2>영어 번역</h2>

    <textarea
        id="englishText"
        placeholder="AI 번역 결과가 표시됩니다."
        readonly
    ></textarea>


    <!-- 영어 읽기 -->

    <button id="speakBtn">
        🔊 영어 읽기
    </button>


    <div class="info">
        처음 번역할 때 AI 모델을 다운로드하므로 시간이 조금 걸릴 수 있습니다.
        한 번 다운로드한 모델은 브라우저 캐시를 사용할 수 있어 이후에는 더 빠릅니다.
    </div>

</div>


<!-- =====================================================
     AI 번역
===================================================== -->

<script type="module">

    /*
        Transformers.js

        브라우저에서 AI 모델을 직접 실행합니다.
        번역 API Key가 필요하지 않습니다.
    */

    import {
        pipeline
    } from
    "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";


    // ----------------------------------------------------
    // HTML 요소
    // ----------------------------------------------------

    const koreanText =
        document.getElementById("koreanText");

    const englishText =
        document.getElementById("englishText");

    const translateBtn =
        document.getElementById("translateBtn");

    const modelStatus =
        document.getElementById("modelStatus");

    const status =
        document.getElementById("status");


    // ----------------------------------------------------
    // AI 모델
    // ----------------------------------------------------

    let translator = null;

    let modelLoading = false;


    // ----------------------------------------------------
    // AI 모델 불러오기
    // ----------------------------------------------------

    async function loadModel() {

        // 이미 모델이 있으면 그대로 사용
        if (translator !== null) {

            return translator;

        }


        if (modelLoading) {

            return;

        }


        modelLoading = true;

        modelStatus.innerText =
            "🤖 AI 번역 모델을 불러오는 중입니다...";


        try {

            translator = await pipeline(

                "translation",

                "Xenova/opus-mt-ko-en",

                {

                    // 브라우저 CPU에서 실행하기 좋은 양자화 모델
                    dtype: "q8",

                    progress_callback: function(data) {

                        if (
                            data.status === "progress" &&
                            data.progress
                        ) {

                            modelStatus.innerText =
                                "🤖 AI 모델 다운로드 중... " +
                                Math.round(data.progress) +
                                "%";

                        }

                    }

                }

            );


            modelStatus.innerText =
                "✅ AI 번역 모델 준비 완료";

            return translator;


        } catch (error) {

            console.error(error);

            modelStatus.innerText =
                "❌ AI 모델 로딩 실패";

            throw error;

        }

        finally {

            modelLoading = false;

        }

    }


    // ----------------------------------------------------
    // AI 번역 함수
    // ----------------------------------------------------

    async function translateKorean(text) {

        if (!text.trim()) {

            return;

        }


        translateBtn.disabled = true;

        status.innerText =
            "🤖 AI 번역 중...";


        try {

            // 모델 불러오기
            const model =
                await loadModel();


            // 실제 AI 번역
            const result =
                await model(text);


            console.log(result);


            // 번역 결과
            const translated =
                result[0].translation_text;


            englishText.value =
                translated;


            status.innerText =
                "✅ 번역 완료";


        } catch (error) {

            console.error(error);

            englishText.value =
                "번역 중 오류가 발생했습니다.";

            status.innerText =
                "❌ 번역 오류";

        }


        translateBtn.disabled = false;

    }


    // ----------------------------------------------------
    // 직접 입력 번역
    // ----------------------------------------------------

    translateBtn.addEventListener(

        "click",

        async function() {

            const text =
                koreanText.value;

            await translateKorean(text);

        }

    );


    // ----------------------------------------------------
    // 음성 인식
    // ----------------------------------------------------

    const SpeechRecognition =

        window.SpeechRecognition ||

        window.webkitSpeechRecognition;


    const startBtn =
        document.getElementById("startBtn");


    if (!SpeechRecognition) {

        startBtn.disabled = true;

        status.innerText =
            "현재 브라우저에서 음성 인식을 지원하지 않습니다.";

    }

    else {

        const recognition =
            new SpeechRecognition();


        // 한국어
        recognition.lang =
            "ko-KR";


        recognition.continuous =
            false;


        recognition.interimResults =
            false;


        // ------------------------------------------------
        // 음성 인식 시작
        // ------------------------------------------------

        startBtn.addEventListener(

            "click",

            function() {

                try {

                    recognition.start();

                    status.innerText =
                        "🎤 듣고 있습니다...";

                    startBtn.disabled =
                        true;

                }

                catch (error) {

                    console.error(error);

                }

            }

        );


        // ------------------------------------------------
        // 음성 인식 결과
        // ------------------------------------------------

        recognition.onresult =
            async function(event) {

                const text =
                    event.results[0][0].transcript;


                // 한국어 표시
                koreanText.value =
                    text;


                status.innerText =
                    "🎤 음성 인식 완료";


                // ========================================
                // 자동 AI 번역
                // ========================================

                await translateKorean(text);

            };


        // ------------------------------------------------
        // 종료
        // ------------------------------------------------

        recognition.onend =
            function() {

                startBtn.disabled =
                    false;

            };


        // ------------------------------------------------
        // 오류
        // ------------------------------------------------

        recognition.onerror =
            function(event) {

                status.innerText =
                    "음성 인식 오류: " +
                    event.error;

                startBtn.disabled =
                    false;

            };

    }


    // ----------------------------------------------------
    // 영어 음성 읽기
    // ----------------------------------------------------

    const speakBtn =
        document.getElementById("speakBtn");


    speakBtn.addEventListener(

        "click",

        function() {

            const text =
                englishText.value.trim();


            if (!text) {

                alert(
                    "먼저 영어 번역을 실행하세요."
                );

                return;

            }


            // 기존 음성 중지
            speechSynthesis.cancel();


            const speech =
                new SpeechSynthesisUtterance(text);


            speech.lang =
                "en-US";


            speech.rate =
                0.9;


            speech.pitch =
                1;


            speechSynthesis.speak(speech);

        }

    );

</script>

</body>

</html>
